name: CI/CD Pipeline - Plant Disease Classifier

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. Continuous Integration (Lint, Type Check & Unit Tests)
  # ============================================================================
  test:
    name: Run Automated Tests & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov

      - name: Code Quality Linting
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 src app.py tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 src app.py tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v --junitxml=pytest-report.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-report.xml

  # ============================================================================
  # 2. Continuous Delivery (Build & Push Docker Image)
  # ============================================================================
  build-and-push:
    name: Build & Push Docker Image
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
        uses: docker/login-action@v3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Test Docker Container
        run: |
          docker build -t plant-disease-classifier:${{ github.sha }} .
          docker tag plant-disease-classifier:${{ github.sha }} plant-disease-classifier:latest

      - name: Push to Docker Registry
        if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          docker tag plant-disease-classifier:latest ${{ secrets.DOCKER_USERNAME }}/plant-disease-classifier:latest
          docker tag plant-disease-classifier:latest ${{ secrets.DOCKER_USERNAME }}/plant-disease-classifier:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/plant-disease-classifier:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/plant-disease-classifier:${{ github.sha }}
